LONGDESC=' Le Cuppers POS is an offline-first restaurant POS with tables, a kitchen
 display, reservations, QR ordering and loyalty. This package installs a systemd
 service that runs the published, version-pinned Le Cuppers POS containers and a
 PostgreSQL database with Docker Compose, keeping all data in Docker volumes on
 this machine. Open http://localhost:1995 after installing.
 .
 Settings are in /etc/nodedr-orderrestro/nodedr-orderrestro.env. Upgrade with apt;
 back up your data first.'
